<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="naver-site-verification" content="...">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동네 익명 채팅 - 우리 동네 사람들과 실시간 대화</title>
<meta name="description" content="지역(시/군/구, 읍/면/동)을 골라 지금 접속한 사람들과 익명으로 실시간 채팅하세요.">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1d21;--sub:#6b7280;--ac:#2f6df6;--acx:#fff;--bd:#e3e6eb;--me:#2f6df6;--other:#eceff4}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--tx:#eceef2;--sub:#9aa1ad;--ac:#5b8cff;--acx:#0b0d12;--bd:#2c3038;--me:#3d6bdc;--other:#2a2e36}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:16px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:0 14px}
h1{font-size:22px;margin:22px 0 4px}
p.sub{color:var(--sub);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
select,input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
button{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer}
button:disabled{opacity:.45}
.full{width:100%;margin-top:14px}
.ghost{background:transparent;color:var(--ac);padding:8px 10px}
#chat{display:none}
.top{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--bd)}
.top .t{flex:1;min-width:0}
.top b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top small{color:var(--sub)}
#log{flex:1;overflow-y:auto;padding:12px 0;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;display:flex;flex-direction:column;gap:2px}
.m .n{font-size:12px;color:var(--sub)}
.m .b{background:var(--other);padding:9px 12px;border-radius:14px;word-break:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;align-items:flex-end}
.m.me .b{background:var(--me);color:#fff}
.sys{align-self:center;color:var(--sub);font-size:13px;text-align:center}
.bar{display:flex;gap:8px;padding:10px 0 12px;border-top:1px solid var(--bd)}
.bar input{flex:1}
</style>
</head>
<body>
<div class="wrap" id="home">
  <h1>💬 동네 익명 채팅</h1>
  <p class="sub">지역을 고르면 지금 그 방에 있는 사람들과 익명으로 실시간 대화할 수 있어요.</p>
  <div class="card">
    <label>시/도</label><select id="s1"></select>
    <label>시/군/구</label><select id="s2"></select>
    <label>읍/면/동</label><select id="s3"></select>
    <button class="full" id="go1">이 지역 채팅방 입장</button>
  </div>
  <div class="card">
    <label>목록에 없는 지역은 직접 입력 (예: 경북 영양군 청기면)</label>
    <input type="text" id="custom" maxlength="30" placeholder="시/도 시/군/구 읍/면/동">
    <button class="full" id="go2">직접 입력한 지역으로 입장</button>
  </div>
  <p class="sub">대화는 저장되지 않아요. 욕설, 도배, 불법·유해 내용은 금지예요.</p>
</div>

<div class="wrap" id="chat">
  <div class="top">
    <button class="ghost" id="back">← 나가기</button>
    <div class="t"><b id="rname"></b><small id="who"></small></div>
  </div>
  <div id="log"></div>
  <div class="bar">
    <input type="text" id="msg" maxlength="200" placeholder="메시지 입력" autocomplete="off">
    <button id="send">전송</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const R={
"서울":{"강남구":["역삼동","삼성동","논현동","청담동","대치동"],"마포구":["합정동","상수동","연남동"],"송파구":["잠실동","가락동"]},
"부산":{"해운대구":["우동","중동"],"부산진구":["부전동(서면)","전포동"]},
"대구":{"중구":["동성로","삼덕동"]},
"인천":{"연수구":["송도동","연수동"]},
"경기":{"성남시 분당구":["정자동","서현동"],"수원시 영통구":["영통동","광교동"]},
"경남":{"창원시 성산구":["상남동","용호동"],"양산시":["물금읍","웅상읍"],"김해시":["장유동","진영읍"]},
"충남":{"서산시":["대산읍","동문동"]},
"전남":{"담양군":["담양읍","봉산면"]},
"제주":{"제주시":["연동","애월읍"]}
};
const $=id=>document.getElementById(id);
const s1=$("s1"),s2=$("s2"),s3=$("s3");
function fill(sel,arr){sel.innerHTML="";arr.forEach(v=>{const o=document.createElement("option");o.value=o.textContent=v;sel.appendChild(o)})}
fill(s1,Object.keys(R));
function u2(){fill(s2,Object.keys(R[s1.value]));u3()}
function u3(){fill(s3,R[s1.value][s2.value])}
s1.onchange=u2;s2.onchange=u3;u2();

const socket=io();
let myId=null,joined=false;
function sys(t){const d=document.createElement("div");d.className="sys";d.textContent=t;$("log").appendChild(d);$("log").scrollTop=1e9}
function bubble(m){
  const mine=m.s===myId;
  const d=document.createElement("div");d.className="m"+(mine?" me":"");
  const n=document.createElement("span");n.className="n";n.textContent=m.n;
  const b=document.createElement("div");b.className="b";b.textContent=m.t;
  if(!mine)d.appendChild(n);d.appendChild(b);$("log").appendChild(d);$("log").scrollTop=1e9;
}
function enter(label){
  label=label.replace(/\s+/g," ").trim();
  if(!label)return;
  $("rname").textContent=label;$("who").textContent="연결 중…";$("log").innerHTML="";
  socket.emit("join",label,res=>{
    if(!res||!res.ok){alert("지역 이름은 한글, 영문, 숫자만 쓸 수 있어요.");return}
    myId=res.id;joined=true;
    $("home").style.display="none";$("chat").style.display="flex";
    sys("내 닉네임은 "+res.nick+" 입니다. 대화는 저장되지 않아요.");
  });
}
function leave(){
  joined=false;
  $("chat").style.display="none";$("home").style.display="flex";
}
function send(){
  const t=$("msg").value.trim();
  if(!t||!joined)return;
  $("msg").value="";
  socket.emit("msg",t);
}
socket.on("msg",m=>{if(joined&&m&&typeof m.t==="string")bubble({n:String(m.n).slice(0,12),t:m.t.slice(0,200),s:m.s})});
socket.on("count",c=>{$("who").textContent="지금 "+c+"명 접속 중"});
socket.on("disconnect",()=>{if(joined)sys("연결이 끊겼어요. 다시 연결 중…")});
socket.on("connect",()=>{if(joined){const l=$("rname").textContent;socket.emit("join",l,res=>{if(res&&res.ok){myId=res.id;sys("다시 연결됐어요.")}})}});
$("go1").onclick=()=>enter(s1.value+" "+s2.value+" "+s3.value);
$("go2").onclick=()=>enter($("custom").value);
$("back").onclick=leave;
$("send").onclick=send;
$("msg").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)send()});
</script>
</body>
</html>
